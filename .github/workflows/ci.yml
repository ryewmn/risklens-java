name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Java tests and package
        run: ./mvnw -B verify
      - name: Python parity tests
        run: python3 -m unittest training/test_parity.py
      - name: Reproduce synthetic training
        run: python3 training/train.py --synthetic-rows 500 --seed 1729 --output build/ci-model.json
      - name: Build container
        run: docker build -t risklens:${{ github.sha }} .
